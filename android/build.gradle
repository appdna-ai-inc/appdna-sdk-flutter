group 'com.appdna.flutter'
version '1.0.5'

buildscript {
    // Inherit the CONSUMER's Kotlin instead of pinning ours.
    //
    // This line used to read `ext.kotlin_version = '1.9.22'`, and it is why a customer could not build. Their
    // host is Kotlin 2.2.20; Kotlin 2.0 moved the Compose compiler OUT of the standalone
    // `kotlinCompilerExtensionVersion` mechanism and INTO `org.jetbrains.kotlin.plugin.compose`, so the
    // unconditional `composeOptions` block below was rejected outright. A customer following our own published
    // installation guide failed here — our defect, not their configuration.
    //
    // `ai.appdna:sdk-android` publishes a precompiled AAR whose 1.9.22 metadata is forward-compatible, so a newer
    // host Kotlin consumes it fine. The React Native wrapper has always inherited the host this way;
    // this wrapper simply never got the same treatment.
    //
    // Both ext names are read: Flutter host templates set `kotlin_version` in the app's android/build.gradle,
    // while the RN template uses `kotlinVersion`. Reading only one silently falls back to 1.9.22 — which is this
    // bug wearing a different hat.
    ext.getExtOrDefault = { name, fallback ->
        rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
    }
    // BUILDSCRIPT-TIME GUESS ONLY. It is read from `rootProject.ext`, which a Flutter host sets only with the
    // OLD template style. Flutter 3.16+ declares Kotlin in settings.gradle's plugins DSL, where this lookup finds
    // nothing and falls back to 1.9.22 — VERIFIED on a real build: the host was Kotlin 2.2.20 and this said
    // 1.9.22, so the K1 branch ran and the build failed exactly as #628 reported. The authoritative detection is
    // `resolvedKotlinVersion` below, after the Kotlin plugin is applied and can be asked directly.
    // Resolving the host's Kotlin at BUILDSCRIPT time is unavoidable: the Compose Compiler Gradle plugin is a
    // SEPARATE artifact from KGP, so it must be on this classpath before `apply plugin:` can find it. Measured on
    // a real Kotlin 2.2.20 host: without it the build dies with "Plugin with id
    // 'org.jetbrains.kotlin.plugin.compose' not found".
    //
    // Two host styles, read in order of reliability:
    //   1. settings.gradle(.kts) plugins DSL — Flutter 3.16+ templates, and what that customer uses.
    //   2. rootProject.ext — older Flutter templates (`kotlin_version`) and the RN convention (`kotlinVersion`).
    // The RN wrapper only needs (2) because RN hosts always set that ext. Flutter hosts often set nothing, which
    // is why porting RN's gating verbatim looked correct and still failed to build.
    ext.hostKotlinFromSettings = {
        for (name in ['settings.gradle', 'settings.gradle.kts']) {
            def f = new File(rootProject.projectDir, name)
            if (!f.exists()) continue
            def m = f.text =~ /org\.jetbrains\.kotlin\.android["']?\s*\)?\s*(?:version)\s*\(?\s*["']([^"']+)["']/
            if (m.find()) return m.group(1)
        }
        return null
    }
    ext.kotlin_version = hostKotlinFromSettings()
        ?: getExtOrDefault('kotlin_version', getExtOrDefault('kotlinVersion', '1.9.22'))
    ext.isKotlin2Guess = kotlin_version.toString().tokenize('.')[0].toInteger() >= 2

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // The Compose Compiler Gradle plugin ships versioned with Kotlin from 2.0 on. Best-effort: only an
        // old-style host reaches here with a truthful version. A plugins-DSL host gets it from KGP instead.
        if (isKotlin2Guess) {
            classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        }
    }
}

allprojects {
    repositories {
        // Env-gated, exactly as the RN wrapper does it: a customer never resolves from mavenLocal,
        // but a pre-publish build can. Without it this plugin cannot be COMPILED at all before the
        // native it pins is published — which is why the Kotlin here went unbuilt, and why a call
        // into an `internal` core symbol survived CI.
        if (System.getenv("APPDNA_ANDROID_SDK_PATH")) {
            mavenLocal()
        }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Ask the Kotlin plugin what version it actually is, now that it is applied.
//
// This is the only detection that works for BOTH host styles. `rootProject.ext.kotlin_version` is unset on a
// Flutter 3.16+ host (plugins DSL in settings.gradle), and guessing 1.9.22 there is what left that customer
// unbuildable: measured on their toolchain, the buildscript guess said 1.9.22 while the host was really 2.2.20.
def resolvedKotlinVersion
try {
    resolvedKotlinVersion = org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt.getKotlinPluginVersion(project)
} catch (Throwable ignored) {
    // Very old KGP without the helper — fall back to the buildscript value rather than failing the build.
    resolvedKotlinVersion = kotlin_version
}
ext.isKotlin2 = resolvedKotlinVersion.toString().tokenize('.')[0].toInteger() >= 2

// On Kotlin 2.0+ this plugin OWNS the Compose compiler; the extension path below is rejected.
if (isKotlin2) {
    apply plugin: 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.appdna.flutter'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        if (!isKotlin2) {
            freeCompilerArgs += [
                "-P",
                "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=$kotlin_version"
            ]
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // This plugin had NO unit-test source set at all, so `parseOptions` — the
        // `framework` tag, the `configTTL` default, the `billingProvider` mapping — was proven on the
        // React Native wrapper and merely CODED here. Run with:
        //   cd example/android && ./gradlew :appdna_sdk_flutter:testDebugUnitTest
        // (from the example, because the Flutter Gradle plugin is what puts the Flutter embedding on
        // this module's compile classpath.)
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 24
        // Ship the plugin's keep rules to minified host release builds.
        consumerProguardFiles 'consumer-rules.pro'
    }

    // NewApi is a CI gate here as in the native SDK (sdk-ci.yml, `:appdna_sdk:lintDebug
    // -PlintCheckOnly=NewApi`): minSdk is 24, and a call above its API guard compiles against
    // compileSdk and crashes only on an old device. CI runs this one check only; it stays an error so a
    // local `lintDebug` reports it too.
    lint {
        error.add('NewApi')
        abortOnError true
        checkDependencies false
        if (project.hasProperty('lintCheckOnly')) {
            checkOnly.addAll(project.property('lintCheckOnly').toString().split(',').collect { it.trim() }.findAll { it })
        }
    }

    // The AppDNAScreenSlot PlatformView invokes the
    // native `@Composable AppDNAScreenSlot(name)` inside a ComposeView, so this
    // module compiles Composable-calling code and needs the Compose compiler.
    // Versions match the native sdk-android toolchain (Kotlin 1.9.22 →
    // Compose Compiler 1.5.8, Compose BoM 2024.02.02).
    buildFeatures {
        compose true
    }
    // Kotlin 1.9.x only: the standalone Compose compiler extension. Because this wrapper now inherits the
    // CONSUMER's Kotlin, the exact-version check is suppressed so one extension serves the 1.9.x range.
    // Kotlin 2.0+: neither block runs — the compose Gradle plugin applied above owns the compiler, and this
    // path would be REJECTED. That rejection is exactly what #628 was.
    if (!isKotlin2) {
        composeOptions {
            kotlinCompilerExtensionVersion '1.5.8'
        }
    }

    // `AppdnaPlugin`'s field initializers touch `Looper.getMainLooper()`, so the tests need a
    // real Android runtime (Robolectric) rather than the throwing android.jar stubs.
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'ai.appdna:sdk-android:1.0.54'

    // `parseOptions` is native-only: a `flutter test` mocks the MethodChannel
    // away, so it can see neither a Kotlin `?: 3600` nor the injected `framework` tag.
    //
    // Robolectric, not a plain JVM test: `parseOptions` itself is pure Kotlin, but reaching it means
    // constructing `AppdnaPlugin`, whose field initializers build a `Handler(Looper.getMainLooper())`
    // — and on the stock `android.jar` every method throws "not mocked".
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    // The bridge-timeout test drives a scripted Dart host on virtual time.
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

    // Compose runtime/UI + the ViewTree owners needed to
    // host a ComposeView outside a ComponentActivity (bare FlutterActivity).
    // sdk-android pulls Compose in via `implementation` (not exported), so the
    // plugin declares its own aligned copies.
    def composeBom = platform('androidx.compose:compose-bom:2024.02.02')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'
}
