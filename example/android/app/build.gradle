plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// SPEC-497 §3.11 TEST-ONLY — the local-server base URL, from the gitignored local.properties
// (`APPDNA_BASE_URL=https://…`) or `-PAPPDNA_BASE_URL=…`. Empty (the committed default) = no override;
// the SDK honours the meta-data only in a debuggable build configured for the sandbox environment.
def appdnaLocalProperties = new Properties()
def appdnaLocalPropertiesFile = rootProject.file("local.properties")
if (appdnaLocalPropertiesFile.exists()) {
    appdnaLocalPropertiesFile.withReader("UTF-8") { appdnaLocalProperties.load(it) }
}
def appdnaBaseUrl = appdnaLocalProperties.getProperty("APPDNA_BASE_URL") ?: (project.findProperty("APPDNA_BASE_URL") ?: "")

android {
    namespace = "ai.appdna.appdna_sdk_example"
    compileSdk = flutter.compileSdkVersion
    // ndkVersion removed (SPEC-070-C): pure-Dart example has no native C/C++, so no NDK
    // is needed; setting it forced an auto-install of an absent NDK on the build host.

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ai.appdna.appdna_sdk_example"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Release builds never carry the override (minor 1): empty here, set for `debug` only below.
        manifestPlaceholders += [appdnaBaseUrlOverride: ""]
    }

    buildTypes {
        debug {
            manifestPlaceholders += [appdnaBaseUrlOverride: appdnaBaseUrl]
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
