plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// TEST-ONLY — the local-server base URL, from the gitignored local.properties
// (`APPDNA_BASE_URL=https://…`) or `-PAPPDNA_BASE_URL=…`. Empty (the committed default) = no override;
// the SDK honours the meta-data only in a debuggable build configured for the sandbox environment.
def appdnaLocalProperties = new Properties()
def appdnaLocalPropertiesFile = rootProject.file("local.properties")
if (appdnaLocalPropertiesFile.exists()) {
    appdnaLocalPropertiesFile.withReader("UTF-8") { appdnaLocalProperties.load(it) }
}
def appdnaBaseUrl = appdnaLocalProperties.getProperty("APPDNA_BASE_URL") ?: (project.findProperty("APPDNA_BASE_URL") ?: "")

// TEST-ONLY — a Google Maps key for the INTERACTIVE map tier, from the same gitignored
// local.properties (`APPDNA_MAPS_KEY=…`) or `-PAPPDNA_MAPS_KEY=…`.
//
// 🔴 Without this the example host could not exercise Tier 2 AT ALL. The Maps SDK for Android reads
// `com.google.android.geo.API_KEY` from the MERGED MANIFEST at build time — there is no runtime
// setter — so `MapInteractive.kt:hasGoogleMapsManifestKey` returned false here and every map block
// fell back to the still image, however the author configured it. A crash report against the
// pannable map (#685) therefore had no host to reproduce it in.
//
// Empty (the committed default) is SAFE and keeps today's behaviour: `hasGoogleMapsManifestKey`
// treats a blank value as absent and the static tier renders, rather than the Maps SDK's grey
// "no key" rectangle. The key itself is never committed — `local.properties` is gitignored, which
// `check:example-no-key` asserts.
def appdnaMapsKey = appdnaLocalProperties.getProperty("APPDNA_MAPS_KEY") ?: (project.findProperty("APPDNA_MAPS_KEY") ?: "")

android {
    namespace = "ai.appdna.appdna_sdk_example"
    compileSdk = flutter.compileSdkVersion
    // ndkVersion removed: pure-Dart example has no native C/C++, so no NDK
    // is needed; setting it forced an auto-install of an absent NDK on the build host.

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ai.appdna.appdna_sdk_example"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Release builds never carry the override (minor 1): empty here, set for `debug` only below.
        manifestPlaceholders += [appdnaBaseUrlOverride: "", appdnaMapsKey: ""]
    }

    buildTypes {
        debug {
            manifestPlaceholders += [appdnaBaseUrlOverride: appdnaBaseUrl, appdnaMapsKey: appdnaMapsKey]
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
